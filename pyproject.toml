[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vates"
version = "0.1.6"
description = "Python actuarial model"
readme = "README_pypi.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    {name = "Shanya Shi", email = "shanyashi2025@gmail.com"}
]
keywords = ["actuarial model", "asset-liability model", "alm"]
dependencies = [
    "numpy>=2.2.6",
    "pandas>=2.3.0, <3.0.0",
]

[project.urls]
Homepage = "https://github.com/shanyashi2025/vates"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "stoch: tests that spawn multiprocessing worker processes (StochExecutor)",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vates*"]
